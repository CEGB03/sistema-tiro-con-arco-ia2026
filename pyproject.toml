[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sistema-tiro-con-arco-ia"
version = "0.1.0"
description = "Sistema multi-agente de transcripción de planillas de tiro con arco"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Carlos Emanuel Gomez Bonelli", email = "cgomez453@alumnos.iua.edu.ar" }]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "gradio>=4.0",
    "Pillow>=10.0",
    "opencv-python>=4.8",
    "requests>=2.31",
    "pypdfium2>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "jupyter>=1.0",
]

[project.scripts]
tiro-con-arco = "tiro_arco.app_tiro_con_arco:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]