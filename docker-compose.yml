services:
  archery_multiagent_app:
    build: .
    container_name: archery_multiagent_app
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=archery_ollama_ocr
    depends_on:
      - archery_ollama_ocr
    restart: unless-stopped

  archery_ollama_ocr:
    image: ollama/ollama:latest
    container_name: archery_ollama_ocr
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_storage:
